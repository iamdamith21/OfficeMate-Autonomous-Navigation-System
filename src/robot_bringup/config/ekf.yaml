# ekf.yaml — robot_localization EKF fusing rf2o laser odometry with the
# MPU9250 gyro (via robot_interface/arduino_bridge).
#
# Why: rf2o alone drifts during pure rotation and in feature-poor corridors;
# the gyro yaw-rate pins rotation down. Config matrices are
#   [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
#
# This node owns the odom -> base_footprint TF (rf2o publish_tf is disabled
# in bringup.launch.py). Fused output: /odometry/filtered.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false

    # Extrapolate the state estimate to the current time when publishing, so
    # the odom->base_footprint TF is stamped at ~now instead of at the last
    # (rf2o 7 Hz + latency ≈ 0.2 s old) measurement time. Without this the
    # fresh 30 Hz LTME-02A scans are stamped newer than the newest TF and
    # slam_toolbox / Nav2 drop them ("transform queue full").
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # rf2o laser odometry — take LINEAR velocity (vx) only. Its yaw-rate (vyaw)
    # is unreliable with the LTME-02A's 270° FoV (blind rear arc weakens
    # rotation estimation), so yaw-rate comes from the gyro instead (imu0).
    odom0: /odom_rf2o
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 5

    # MPU9250 — gyro yaw rate only (no orientation estimate on /imu/data_raw)
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

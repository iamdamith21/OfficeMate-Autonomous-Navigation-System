# Nav2 full parameter set — my_robot differential drive
#
# Algorithms chosen:
#   Global planner  : SmacPlanner2D  (grid A*, best for diff-drive)
#   Local controller: RotationShimController → RegulatedPurePursuitController
#   Path smoother   : SavitzkyGolaySmoother
#   Localisation    : AMCL (DifferentialMotionModel)
#
# Robot geometry (from urdf/properties.xacro):
#   footprint  : 44cm × 40cm  (body 40×30 + 2cm pad + wheels to ±19.5cm Y)
#   polygon    : [[0.22, 0.20], [-0.22, 0.20], [-0.22,-0.20], [ 0.22,-0.20]]
#   wheel_sep  : 0.33 m     wheel_radius : 0.065 m
#   max speed  : 0.25 m/s   max ω        : 1.0 rad/s
#
# Odom source : EKF (rf2o + IMU gyro) → /odometry/filtered  (TF odom→base_footprint)
# cmd_vel flow: controller_server → /cmd_vel_nav → velocity_smoother → /cmd_vel → robot
# Low obstacles: HC-SR04 → /ultrasonic/range → local costmap range_layer
#                (plus a hard forward-stop clamp inside arduino_bridge)

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2           # rot noise from rot
    alpha2: 0.2           # rot noise from trans
    alpha3: 0.2           # trans noise from trans
    alpha4: 0.2           # trans noise from rot
    alpha5: 0.2           # trans noise from strafe
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.10
    max_beams: 60
    max_particles: 1500   # was 3000 — halved for Pi 4B CPU headroom
    min_particles: 300    # was 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_slow: 0.001
    lambda_fast: 0.1
    update_min_a: 0.1       # recompute after 0.1 rad rotation
    update_min_d: 0.1       # recompute after 0.1 m translation
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    # Tuned down from the 100 Hz/1 s defaults — a Pi 4B running the full
    # Nav2 stack (~10 processes) can't keep up with those under load,
    # which caused "tick rate exceeded" and action-ack timeouts that
    # aborted every goal before the robot could move. 5 Hz BT tick still
    # comfortably matches the BT's own 1 Hz replanning RateController.
    bt_loop_duration: 200
    default_server_timeout: 30
    wait_for_service_timeout: 10000
    action_server_result_timeout: 900.0
    enable_groot_monitoring: false
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ── Controller server (RotationShim → RPP) ──────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 5.0   # was 10.0 — reduced for Pi 4B CPU headroom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

    FollowPath:
      # Outer: RotationShim — rotates robot in-place to align with path
      #        before handing off to the inner RPP controller.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.785    # rotate in-place if heading error > 45°
      forward_sampling_distance: 0.5   # check if path goes forward this far
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Inner: RegulatedPurePursuitController
      desired_linear_vel: 0.25         # m/s — target cruise speed
      lookahead_dist: 0.40             # m   — base lookahead
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      lookahead_time: 1.5              # s   — time-scaled lookahead
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true   # slow near tight curves
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: true  # slow near obstacles
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true      # let RPP also handle small heading fixes
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.5

# ── Planner server (SmacPlanner2D = grid A*) ─────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0   # matches BT's RateController hz="1.0"
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# ── Path smoother (SavitzkyGolay) ────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["SavitzkyGolaySmoother"]
    SavitzkyGolaySmoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      num_it: 1000
      do_refinement: true
      refinement_num: 2

# ── Local costmap (rolling 4 m × 4 m) ────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 3.0    # was 5.0 — reduced for Pi 4B CPU headroom
      publish_frequency: 1.0   # was 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.22, 0.20], [-0.22, 0.20], [-0.22, -0.20], [0.22, -0.20]]"
      footprint_padding: 0.01
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "range_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser
          data_type: LaserScan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 3.5     # only mark obstacles within 3.5 m locally
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5     # clear cells beyond sensor
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          inf_is_valid: false

      # HC-SR04 front-low sonar — marks obstacles under the lidar plane
      # (chair legs, boxes). arduino_bridge publishes max_range on no-echo
      # so clear_on_max_reading frees the cone again once the way is clear.
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ultrasonic/range"]
        phi: 1.2
        inflate_cone: 1.0
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        clear_on_max_reading: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0       # decay rate (higher = sharper)
        inflation_radius: 0.45         # ≥ circumscribed radius (0.30m) + margin

# ── Global costmap (full map) ─────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.22, 0.20], [-0.22, 0.20], [-0.22, -0.20], [0.22, -0.20]]"
      footprint_padding: 0.01
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser
          data_type: LaserScan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

      # KeepoutFilter reads from /costmap_filter_info (published by
      # costmap_filter_info_server when use_keepout_filter:=true).
      # Safe to leave enabled — if info server not running it no-ops.
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"

# ── Map server (navigation map) ───────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""     # set at launch via map:=<path> argument

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ── Behaviour server ──────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ── Waypoint follower ─────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ── Velocity smoother ─────────────────────────────────────────────────────────
# Reads /cmd_vel_nav (from controller_server), outputs /cmd_vel (to robot).
# Remapping is applied in navigation.launch.py.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [ 0.25, 0.0,  1.0]
    min_velocity: [-0.25, 0.0, -1.0]
    max_accel:    [ 2.0,  0.0,  3.2]
    max_decel:    [-2.0,  0.0, -3.2]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ── Lifecycle managers ────────────────────────────────────────────────────────
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['map_server', 'amcl']

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    # smoother_server and waypoint_follower are not launched (see
    # navigation.launch.py) — the custom BT never calls Smooth or
    # FollowWaypoints, so they were pure CPU overhead on the Pi.
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother

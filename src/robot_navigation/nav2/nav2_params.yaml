# Nav2 full parameter set — my_robot differential drive
#
# Algorithms chosen:
#   Global planner  : SmacPlanner2D  (grid A*, best for diff-drive)
#   Local controller: RotationShimController → RegulatedPurePursuitController
#   Path smoother   : SavitzkyGolaySmoother
#   Localisation    : AMCL (DifferentialMotionModel)
#
# Robot geometry (from urdf/properties.xacro):
#   footprint  : 44cm × 40cm  (body 40×30 + 2cm pad + wheels to ±19.5cm Y)
#   polygon    : [[0.22, 0.20], [-0.22, 0.20], [-0.22,-0.20], [ 0.22,-0.20]]
#   wheel_sep  : 0.33 m     wheel_radius : 0.065 m
#   max speed  : 0.25 m/s   max ω        : 1.0 rad/s
#
# ANGULAR TUNING (2026-07-27): every angular limit used to sit at 0.20 rad/s,
# which was the robot's measured full-PWM ceiling on a tired battery. Capping
# the command at the saturation point left no proportional band at all — every
# turn request became "full deflection", which is exactly why turning felt slow
# AND jerky. Now 0.50 rad/s, with the firmware's pivot gain rescaled to match
# so 0.50 rad/s maps onto full PWM. Turns are faster and, more importantly,
# actually modulated. The real MPU6500 gyro (fitted 2026-07-27) is what makes
# the higher rate safe: rotation used to wreck localisation because rf2o alone
# cannot track a pivot.
#
# Odom source : EKF (rf2o + IMU gyro) → /odometry/filtered  (TF odom→base_footprint)
# cmd_vel flow: controller_server → /cmd_vel_nav → velocity_smoother → /cmd_vel → robot
# Low obstacles: HC-SR04 → /ultrasonic/range → local costmap range_layer
#                (plus a hard forward-stop clamp inside arduino_bridge)

amcl:
  ros__parameters:
    use_sim_time: false
    # alpha1/alpha4 (the rotation-driven terms) halved now that a real gyro
    # feeds the EKF — odometry during a pivot is far better than it was, so
    # AMCL no longer needs to spread particles so widely on every turn.
    alpha1: 0.1           # rot noise from rot
    alpha2: 0.2           # rot noise from trans
    alpha3: 0.2           # trans noise from trans
    alpha4: 0.1           # trans noise from rot
    alpha5: 0.2           # trans noise from strafe
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.10
    max_beams: 60
    max_particles: 1500   # was 3000 — halved for Pi 4B CPU headroom
    min_particles: 300    # was 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_slow: 0.001
    lambda_fast: 0.1
    update_min_a: 0.1       # recompute after 0.1 rad rotation
    update_min_d: 0.1       # recompute after 0.1 m translation
    tf_broadcast: true
    transform_tolerance: 1.0
    save_pose_rate: 0.5
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    # Tuned down from the 100 Hz/1 s defaults — a Pi 4B running the full
    # Nav2 stack (~10 processes) can't keep up with those under load,
    # which caused "tick rate exceeded" and action-ack timeouts that
    # aborted every goal before the robot could move. 5 Hz BT tick still
    # comfortably matches the BT's own 1 Hz replanning RateController.
    bt_loop_duration: 200
    default_server_timeout: 30
    wait_for_service_timeout: 10000
    action_server_result_timeout: 900.0
    enable_groot_monitoring: false
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ── Controller server (RotationShim → RPP) ──────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: false
    # Was unset, so it silently defaulted to "odom" — a topic with zero
    # publishers here (rf2o publishes /odom_rf2o, the EKF /odometry/filtered).
    # The controller therefore saw the robot as permanently stationary.
    odom_topic: /odometry/filtered
    controller_frequency: 8.0   # was 5.0. 5 Hz produced a 200 ms velocity
    # staircase (the jerk). Raised together with halving the lidar beam count,
    # because on a saturated CPU a faster loop just arrives late.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 25.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

    FollowPath:
      # Outer: RotationShim — rotates robot in-place to align with path
      #        before handing off to the inner RPP controller.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      angular_dist_threshold: 0.785    # rotate in-place if heading error > 45°
      forward_sampling_distance: 0.5   # check if path goes forward this far
      # 0.18 rad/s meant ~17 s to swing 180° before the robot even started
      # following the path. This is the number that made navigation feel slow.
      rotate_to_heading_angular_vel: 0.55
      max_angular_accel: 1.5
      simulate_ahead_time: 1.0
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # Inner: RegulatedPurePursuitController
      # Raised 0.18 -> 0.20 to sit at the measured ceiling (velocity_smoother
      # max_velocity is 0.20 and 0.22 was erratic on the floor). This is the
      # only speed headroom left on this robot and it is ~11%, so it will
      # barely be perceptible: the slowness observed on 2026-07-31 was the
      # robot STANDING STILL (cmd_vel contention, then the final-approach
      # stall), not a low speed limit.
      desired_linear_vel: 0.26         # m/s — target cruise speed (raised on request; above 0.20 rf2o tracking degrades)
      # RPP does its own in-place rotation when use_rotate_to_heading is on;
      # without these it would fall back to defaults and undo the shim's rate.
      rotate_to_heading_angular_vel: 0.55
      max_angular_accel: 1.5
      lookahead_dist: 0.40             # m   — base lookahead
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.90
      lookahead_time: 1.5              # s   — time-scaled lookahead
      use_velocity_scaled_lookahead_dist: true
      # 0.05 m/s is below this drivetrain's stiction: 4WD skid-steer, no
      # encoders, and floor calibration only ever verified clean tracking
      # at 0.15 m/s. RPP scales toward this value over the last
      # approach_velocity_scaling_dist metres, so the final approach asked
      # for a speed the motors could not break loose at: the robot parked
      # 0.24 m short (outside the 0.20 m xy tolerance) and controller_server
      # replanned every 1.6 s forever while standing perfectly still, with
      # nothing in the log naming a cause. Must stay above stiction.
      min_approach_linear_velocity: 0.12
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.6
      use_regulated_linear_velocity_scaling: true   # slow near tight curves
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false  # was true: in this
      # tight room nearly every legal cell is inflated, so this throttled the
      # robot everywhere and made desired_linear_vel meaningless.
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.22
      use_rotate_to_heading: true      # let RPP also handle small heading fixes
      rotate_to_heading_min_angle: 0.785
      # true so a robot wedged inside its own circumscribed radius has a
      # legal move. It could previously neither rotate (footprint sweeps
      # into the wall) nor reverse, which is a hard deadlock.
      allow_reversing: true
      max_robot_pose_search_dist: 10.0
      transform_tolerance: 0.5

# ── Planner server (SmacPlanner2D = grid A*) ─────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0   # matches BT's RateController hz="1.0"
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.125
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

# ── Path smoother (SavitzkyGolay) ────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["SavitzkyGolaySmoother"]
    SavitzkyGolaySmoother:
      plugin: "nav2_smoother::SavitzkyGolaySmoother"
      num_it: 1000
      do_refinement: true
      refinement_num: 2

# ── Local costmap (rolling 4 m × 4 m) ────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 3.0    # was 5.0 — reduced for Pi 4B CPU headroom
      publish_frequency: 1.0   # was 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.22, 0.20], [-0.22, 0.20], [-0.22, -0.20], [0.22, -0.20]]"
      footprint_padding: 0.01
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "range_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser
          data_type: LaserScan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 3.5     # only mark obstacles within 3.5 m locally
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5     # clear cells beyond sensor
          raytrace_min_range: 0.0
          clearing: true
          marking: true
          inf_is_valid: false

      # HC-SR04 front-low sonar — marks obstacles under the lidar plane
      # (chair legs, boxes). arduino_bridge publishes max_range on no-echo
      # so clear_on_max_reading frees the cone again once the way is clear.
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        # DISABLED 2026-07-31: the HC-SR04 publishes, but its readings are not
        # trustworthy enough to mark a costmap. Measured with the robot
        # STATIONARY facing a static scene, consecutive readings were
        # 0.37 / 0.60 / 0.92 / 1.44 / 1.82 / 3.0 m -- that is noise, not a
        # measurement. Combined with phi below (a 69 deg cone) every short
        # reading painted a wide lethal arc straight ahead, so RPP reported
        # "detected collision ahead!" continuously: the planner produced a good
        # path, the robot wiggled in place, and every goal ABORTED with
        # "Controller patience exceeded". Note this only started once the sonar
        # began working -- while it returned -1 the layer cleared harmlessly.
        #
        # Re-enable ONLY after the sonar reads a stable distance while parked,
        # and drop phi to about 0.26 rad first to match the HC-SR04's real
        # ~15 deg beam; 1.2 rad over-marks enormously either way.
        # The lidar obstacle_layer still handles obstacles, and the forward-stop
        # clamp in arduino_bridge remains the low-obstacle safety net.
        enabled: false
        topics: ["/ultrasonic/range"]
        phi: 1.2
        inflate_cone: 1.0
        # MUST stay 0.0 (check disabled). A non-zero timeout makes
        # RangeSensorLayer mark itself NOT CURRENT whenever the sonar pauses,
        # which makes the whole local costmap stale, and controller_server then
        # aborts follow_path every cycle -- silently, with no exception logged.
        # Symptom: the planner produces a good path, the robot never moves, and
        # nothing in the log says why. A brief sonar gap must never be able to
        # immobilise the robot; the forward-stop clamp in arduino_bridge is the
        # safety net for a genuinely dead sensor.
        no_readings_timeout: 0.0
        clear_threshold: 0.2
        mark_threshold: 0.8
        clear_on_max_reading: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0       # decay rate (higher = sharper)
        inflation_radius: 0.38         # was 0.45. Still > the 0.30 m
        # circumscribed radius so the real lethal ring is unchanged; this only
        # shrinks the decay skirt that made every cell look expensive.

# ── Global costmap (full map) ─────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.22, 0.20], [-0.22, 0.20], [-0.22, -0.20], [0.22, -0.20]]"
      footprint_padding: 0.01
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
        subscribe_to_updates: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser
          data_type: LaserScan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
          clearing: true
          marking: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.38

      # KeepoutFilter reads from /costmap_filter_info (published by
      # costmap_filter_info_server when use_keepout_filter:=true).
      #
      # DISABLED by default 2026-07-27. The old comment claimed it "no-ops" if
      # the info server is not running — it does not: it logs
      # "KeepoutFilter: Filter mask was not received" every 2 s forever, which
      # buries real planner warnings in the log. navigation.launch.py only
      # starts the info server when use_keepout_filter:=true, so the default
      # path was always the noisy one. Turn this back on together with that
      # launch argument.
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: false
        filter_info_topic: "/costmap_filter_info"

# ── Map server (navigation map) ───────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""     # set at launch via map:=<path> argument

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ── Behaviour server ──────────────────────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    simulate_ahead_time: 1.2
    max_rotational_vel: 0.55   # raised on request (past the 0.45 measured-honest point; firmware clamps ~0.50)
    min_rotational_vel: 0.08
    rotational_acc_lim: 2.2

# ── Waypoint follower ─────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ── Velocity smoother ─────────────────────────────────────────────────────────
# Reads /cmd_vel_nav (from controller_server), outputs /cmd_vel (to robot).
# Remapping is applied in navigation.launch.py.
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # This is the hard ceiling — nothing downstream can exceed it, so the
    # controller limits above are pointless without raising it here too.
    # Linear stays conservative: 0.15 m/s tracked to within 2% on this robot
    # but 0.22 m/s was erratic, so 0.20 is the honest ceiling.
    # Angular ceiling is 0.45, not 0.50, and that is a measured choice.
    # turntest.py (gyro as ground truth, 2026-07-27) gave achieved/commanded:
    #   0.15 -> 0.87   0.25 -> 0.86   0.35 -> 0.87   0.45 -> 1.02   0.50 -> 1.19
    # The response stays honest up to 0.45 and then runs away. Nav2's
    # controllers assume commanded ~= achieved, so operating in the 1.19 region
    # buys nothing but heading overshoot. rotate_to_heading_angular_vel is
    # 0.45 anyway, so nothing is lost -- and it is still 2.25x the old 0.20.
    max_velocity: [ 0.28, 0.0,  0.60]
    min_velocity: [-0.28, 0.0, -0.60]
    # Accel limits are what make the motion SMOOTH rather than stepped. The
    # controller runs at only 5 Hz on the Pi, so the smoother's 20 Hz ramp is
    # doing most of the work of turning 5 Hz staircase commands into
    # continuous motion. 1.5 rad/s² reaches full turn rate in ~0.33 s.
    max_accel:    [ 0.6,  0.0,  2.2]
    max_decel:    [-0.7,  0.0, -2.2]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ── Lifecycle managers ────────────────────────────────────────────────────────
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['map_server', 'amcl']

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    # smoother_server and waypoint_follower are not launched (see
    # navigation.launch.py) — the custom BT never calls Smooth or
    # FollowWaypoints, so they were pure CPU overhead on the Pi.
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother

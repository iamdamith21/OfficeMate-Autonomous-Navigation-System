# SLAM Toolbox — async online mapping with Ceres pose-graph optimization.
# Tuned for LTME-02A LiDAR (270° FoV).
#
# Keyframe spacing & loop closure settings are tuned for crisp single-loop mapping:
# 1. minimum_travel_distance = 0.25m / minimum_travel_heading = 0.30 rad:
#    Prevents pose-graph node bloat and stops redundant scan overlay/ghosting
#    when driving over the same area multiple times.
# 2. Strict loop closure thresholds (0.45/0.55):
#    Ensures loop closure only fires on high-confidence matches so double-walls are eliminated.

slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: HuberLoss      # robust pose-graph optimization

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.04      # 25 Hz TF — saves CPU
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    use_scan_matching: true
    use_scan_barycenter: true

    # Keyframe density: 25cm / 17deg travel before creating a new graph node.
    # Eliminates node bloat and prevents double/ghost wall mapping.
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.30
    scan_buffer_size: 20                 # retains 20 scans for scan matching
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.5

    # Loop closure: search up to 5.0m for loop closure, requiring strict confidence
    loop_search_maximum_distance: 5.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    correlation_search_space_dimension: 0.6
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.05

    distance_variance_penalty: 0.3
    angle_variance_penalty: 0.5
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
